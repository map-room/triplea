name: Publish AI Sidecar Docker Image

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/map-room/ai-sidecar:latest
            ghcr.io/map-room/ai-sidecar:${{ github.sha }}

      # map-room/map-room#3702: this workflow runs on: push to main (post-merge,
      # after every PR already shows green) and nothing alerted on failure —
      # it went red for 11 weeks before anyone noticed. These two steps make
      # failure visible in the one place the crew already watches (GitHub
      # issues) without any new secrets or external services: open/update a
      # single tracking issue on failure, and auto-close it the moment a push
      # goes green again, so it can't linger forever if someone forgets.
      - name: Open or update failure-tracking issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const TITLE = 'ci: Publish AI Sidecar Docker Image is failing on main';
            const LABEL = 'publish-sidecar-broken';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: LABEL,
            });
            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body: `Still failing: ${runUrl} (commit ${context.sha})`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: TITLE,
                labels: [LABEL, 'bug'],
                body: `\`Publish AI Sidecar Docker Image\` failed on a push to \`main\`.\n\nFirst failing run: ${runUrl}\nCommit: ${context.sha}\n\nThis is a post-merge, push-triggered workflow — PRs don't see it, so this issue is the alert. It will auto-close the next time this workflow succeeds on \`main\`.`,
              });
            }

      - name: Close failure-tracking issue on recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'publish-sidecar-broken';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: LABEL,
            });
            for (const issue of existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Recovered: ${runUrl} (commit ${context.sha}) succeeded. Closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
